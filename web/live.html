<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hear the Game</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Hear the Game">
<meta name="theme-color" content="#0d1512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: night-match broadcast desk. Pitch + Director timeline on the left, listening controls on the right; stacks on phones. Deliberately single dark theme. */
:root {
  color-scheme: dark;
  --night: #0d1512;
  --desk: #141f1b;
  --line: #24332d;
  --chalk: #e8efe9;
  --muted: #8fa39a;
  --turf: #12301f;
  --turf-line: rgba(232, 239, 233, 0.32);
  --red: #f06a4f;
  --blue: #5b9cf5;
  --amber: #f2b33d;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; overflow-anchor: none; }  /* TR and EN texts differ in length: no scrollbar jump, no scroll-anchoring jump */
#status { min-height: 1.5em; }
#voiceNote { min-height: 4.5em; }
#modes, #chapters, #commLang { display: flex; width: 100%; }
#modes button, #chapters button, #commLang button { flex: 1 1 0; white-space: nowrap; }
#chapters button { padding-inline: 6px; min-width: 0; white-space: normal; line-height: 1.25; }  /* long labels wrap on phones */
body {
  background: var(--night); color: var(--chalk); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "title sub lang"; align-items: center; gap: 8px 24px; min-width: 0; }
.hdr-right { display: contents; }  /* its children sit in the header grid, so phones can put the TR/EN switch beside the title */
h1 { grid-area: title; font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5vw, 44px); letter-spacing: 0.01em; margin: 0; line-height: 1; text-transform: uppercase; }
h1 .accent { color: var(--amber); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; text-transform: none; }
.sub { grid-area: sub; justify-self: end; text-align: right; color: var(--muted); margin: 0; max-width: 62ch; min-height: 3em; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.stage { display: grid; gap: 10px; min-width: 0; }
.scorebar { display: flex; flex-wrap: nowrap; align-items: center; gap: 16px; min-width: 0; font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: 0.03em; }
.team { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.team > span:not(.dot) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }  /* one line in every language: the pitch never moves */
.dot { flex: none; width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.score { flex: none; font-family: var(--mono); font-size: 20px; padding: 2px 10px; background: var(--desk); border: 1px solid var(--line); border-radius: 4px; }
.clock { flex: none; margin-left: auto; font-family: var(--mono); font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pitch-box { position: relative; border-radius: 6px; overflow: hidden; background: var(--turf); max-width: 100%; aspect-ratio: 105 / 68; }
#pitch { width: 100%; height: 100%; display: block; }
.blind { position: absolute; inset: 0; background: #050807; display: grid; place-items: center; text-align: center; padding: 16px; }
.blind[hidden] { display: none; }
.blind p { font-family: var(--display); font-size: clamp(22px, 4vw, 34px); text-transform: uppercase; letter-spacing: 0.06em; margin: 0; }
.blind small { display: block; font-family: var(--body); font-size: 14px; color: var(--muted); text-transform: none; letter-spacing: 0; margin-top: 6px; }
.caption { min-width: 0; height: calc(4 * 1.5em + 22px); overflow-y: auto;  /* fixed height: TR and EN sentences differ in length, and the layout must not jump */ background: var(--desk); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; display: flex; gap: 12px; align-items: flex-start; }
.caption .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--night); background: var(--amber); padding: 2px 6px; border-radius: 3px; flex: none; margin-top: 2px; }
.caption .tag.idle { background: var(--line); color: var(--muted); }
.caption .tag.mine { background: var(--chalk); }
.caption .tags { display: grid; gap: 4px; flex: none; justify-items: start; }
.yours { flex: none; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--night); background: var(--chalk); padding: 1px 5px; border-radius: 3px; }
.yours[hidden] { display: none; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--muted); }
.play-row { align-items: center; }
#captionText { margin: 0; min-width: 0; }
#captionSub { display: block; margin-top: 2px; font-size: 12px; line-height: 1.4; color: var(--muted); }  /* the same sentence in the interface language */
#captionSub[hidden], .out small[hidden] { display: none; }
.recap .out small { font-size: 12px; color: var(--muted); }
@media (max-width: 600px) {
  header { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title lang" "sub sub"; }
  .sub { font-size: 13px; min-height: 4.5em; justify-self: start; text-align: left; }
  .scorebar { font-size: 18px; gap: 10px; }
  .score { font-size: 16px; padding: 2px 8px; }
  .clock { font-size: 15px; }
  .caption { height: calc(6 * 1.5em + 22px); }
}
@media (max-width: 380px) {
  header { gap: 8px 12px; }
  h1 { white-space: nowrap; }
  .scorebar { font-size: 16px; gap: 7px; letter-spacing: 0; }
  .team { gap: 5px; }
  .dot { width: 9px; height: 9px; }
  .score { font-size: 14px; padding: 2px 6px; }
  .clock { font-size: 13px; }
}
aside { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--desk); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 12px; }
.panel h2 { font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button, select { font: inherit; color: var(--chalk); background: #1c2a25; border: 1px solid var(--line); border-radius: 5px; padding: 8px 12px; cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#playBtn { background: var(--amber); color: var(--night); border-color: var(--amber); font-weight: 500; min-width: 120px; }
#tourBtn { justify-self: start; border-style: dashed; border-color: var(--amber); color: var(--amber); background: transparent; }
#tourBtn[aria-pressed="true"] { border-style: solid; background: transparent; color: var(--chalk); border-color: var(--chalk); }
#tourBtn[hidden] { display: none; }
#installBtn { justify-self: stretch; }
#installBtn[hidden] { display: none; }
#recapBtn[aria-busy="true"] { opacity: 0.7; cursor: progress; }
.recap .out { display: grid; gap: 4px; padding: 8px 10px; border-left: 3px solid var(--amber); background: #101a16; border-radius: 0 4px 4px 0; }
.recap .out b { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); }
button[aria-pressed="true"] { background: var(--chalk); color: var(--night); border-color: var(--chalk); }
.chips button { padding: 5px 9px; font-size: 13px; }
.toggles { display: grid; gap: 7px; }
.toggles label { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.toggles input { accent-color: var(--amber); width: 16px; height: 16px; }
.meter { display: grid; grid-template-columns: 76px minmax(0, 1fr) 42px; align-items: center; gap: 10px; font-size: 13px; }
.meter .bar { height: 8px; background: #0f1916; border-radius: 4px; overflow: hidden; position: relative; }
.meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; }
.meter .val { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.pan .bar { overflow: visible; }
.pan .knob { position: absolute; top: -3px; width: 14px; height: 14px; border-radius: 50%; background: var(--chalk); left: calc(50% - 7px); }
.pan .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.panlabels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin: -6px 0 0 86px; padding-right: 52px; }
ol.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; }
ol.log li { display: grid; grid-template-columns: 46px 10px minmax(0, 1fr); gap: 8px; align-items: center; }
ol.log time { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
ol.log .fav { color: var(--amber); font-size: 11px; margin-left: 4px; }
ol.log .empty { color: var(--muted); display: block; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 6px 12px; background: transparent; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--night); }
/* Interface language: a globe + dropdown pill, so it does not look like the EN/TR commentary buttons in the panel */
#appLang { grid-area: lang; display: inline-flex; align-items: center; gap: 6px; padding: 0 4px 0 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); cursor: pointer; }
#appLang:hover { border-color: var(--muted); }
#appLang:focus-within { outline: 2px solid var(--amber); outline-offset: 2px; }
#appLang svg { flex: none; }
#appLang select { border: 0; background: transparent; padding: 6px 4px; font-size: 13px; }
#appLang select:focus-visible { outline: none; }
#appLang option { background: var(--desk); }
@media (max-width: 380px) {  /* keeps the pill clear of the title at 320 px */
  #appLang { gap: 3px; padding-left: 7px; }
  #appLang select { padding: 5px 0; font-size: 12px; }
}
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field select { width: 100%; color: var(--chalk); }
.recap { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.recap time { font-family: var(--mono); color: var(--muted); margin-right: 8px; }
body[data-mode="eyes_free"] .analyst-only, body[data-mode="casual"] .analyst-only { display: none; }
body[data-mode="eyes_free"] .stage .scorebar .clock { display: none; }
.fav-flash { animation: flash 0.9s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--amber); } to { box-shadow: 0 0 0 3px transparent; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="sr-only">Hear the Game</span><span aria-hidden="true">Hear the <span class="accent">Game</span></span></h1>  <!-- one text for screen readers; VoiceOver split the coloured word -->
    <div class="hdr-right">
      <p class="sub" data-i18n="sub"></p>
      <label id="appLang">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <select id="uiLangSel" data-i18n-aria="uiLangLabel"><option value="en" lang="en">English</option><option value="tr" lang="tr">Türkçe</option></select>
      </label>
    </div>
  </header>

  <div class="grid">
    <section class="stage" data-i18n-aria="matchView">
      <div class="scorebar">
        <span class="team"><span class="dot" id="dotHome" style="background: var(--red)"></span><span id="nameHome" data-i18n="home"></span><span class="yours" id="yoursHome" data-i18n="yourTeam" hidden></span></span>
        <span class="score" id="score">0 – 0</span>
        <span class="team"><span class="yours" id="yoursAway" data-i18n="yourTeam" hidden></span><span id="nameAway" data-i18n="away"></span><span class="dot" id="dotAway" style="background: var(--blue)"></span></span>
        <span class="clock" id="clock">0:00</span>
      </div>
      <div class="pitch-box">
        <canvas id="pitch" data-i18n-aria="pitchAria"></canvas>
        <div class="blind" id="blind" hidden><p><span data-i18n="blindTitle"></span><small data-i18n="blindSub"></small></p></div>
      </div>
      <div class="caption" id="caption" aria-live="polite">
        <span class="tags"><span class="tag idle" id="captionTag" data-i18n="tagIdle"></span><span class="tag mine" id="captionMine" data-i18n="yourTeam" hidden></span></span>
        <p id="captionText"><span id="captionMain" data-i18n="captionIdle"></span><small id="captionSub" hidden></small></p>
      </div>
    </section>

    <aside>
      <div class="panel">
        <div class="field"><span data-i18n="chapterLabel" id="chapterLabel"></span>
          <div class="seg" role="group" aria-labelledby="chapterLabel" id="chapters">
            <button type="button" data-chapter="kickoff" aria-pressed="false" data-i18n="ch_kickoff"></button>
            <button type="button" data-chapter="first_goal" aria-pressed="true" data-i18n="ch_first_goal"></button>
            <button type="button" data-chapter="late" aria-pressed="false" data-i18n="ch_late"></button>
          </div>
        </div>
        <div class="row play-row">
          <button id="playBtn" type="button" aria-keyshortcuts="Space"></button>
          <span class="note" aria-hidden="true"><kbd data-i18n="spaceKey"></kbd></span>
          <button id="blindBtn" type="button" aria-pressed="false" data-i18n="blindBtn"></button>
        </div>
        <button id="tourBtn" type="button" hidden></button>
        <div class="field"><span data-i18n="modeLabel" id="modeLabel"></span>
          <div class="seg" role="group" aria-labelledby="modeLabel" id="modes">
            <button type="button" data-mode="eyes_free" aria-pressed="false" data-i18n="mode_eyes_free"></button>
            <button type="button" data-mode="casual" aria-pressed="true" data-i18n="mode_casual"></button>
            <button type="button" data-mode="analyst" aria-pressed="false" data-i18n="mode_analyst"></button>
          </div>
        </div>
        <div class="field"><span data-i18n="commLabel" id="commLabel"></span>
          <div class="seg" role="group" aria-labelledby="commLabel" id="commLang">
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
            <button type="button" data-lang="tr" aria-pressed="false">TR</button>
          </div>
        </div>
        <label class="field" for="club"><span data-i18n="clubLabel"></span>
          <select id="club"><option value="" data-i18n="clubNone"></option><option value="HOME"></option><option value="AWAY"></option></select>
        </label>
        <label class="field" for="fav"><span data-i18n="favLabel"></span>
          <select id="fav"></select>
        </label>
        <p class="note" id="status" role="status"></p>
        <p class="note" id="voiceNote"></p>
      </div>

      <div class="panel">
        <h2 data-i18n="recapTitle"></h2>
        <button id="recapBtn" type="button" data-i18n="recapBtn"></button>
        <ol class="recap" id="recap" aria-live="polite"></ol>
      </div>

      <div class="panel analyst-only" aria-live="off">
        <h2 data-i18n="nowTitle"></h2>
        <div class="meter"><span data-i18n="danger"></span><span class="bar"><span class="fill" id="mDanger" style="background: var(--amber)"></span></span><span class="val" id="vDanger">0.00</span></div>
        <div class="meter"><span data-i18n="pressure"></span><span class="bar"><span class="fill" id="mPress" style="background: var(--muted)"></span></span><span class="val" id="vPress">0.00</span></div>
        <div class="meter pan"><span data-i18n="wing"></span><span class="bar"><span class="mid"></span><span class="knob" id="mPan"></span></span><span class="val" id="vPan">orta</span></div>
        <div class="panlabels"><span data-i18n="earL"></span><span data-i18n="earR"></span></div>
        <ol class="log" id="log"></ol>
      </div>

      <div class="panel">
        <h2 data-i18n="layersTitle"></h2>
        <div class="toggles">
          <label for="L_ball"><input type="checkbox" id="L_ball" checked> <span data-i18n="lBall"></span></label>
          <label for="L_press"><input type="checkbox" id="L_press" checked> <span data-i18n="lPress"></span></label>
          <label for="L_crowd"><input type="checkbox" id="L_crowd" checked> <span data-i18n="lCrowd"></span></label>
          <label for="L_cue"><input type="checkbox" id="L_cue" checked> <span data-i18n="lCue"></span></label>
          <label for="L_voice"><input type="checkbox" id="L_voice" checked> <span data-i18n="lVoice"></span></label>
        </div>
      </div>
      <button id="installBtn" type="button" data-i18n="install" hidden></button>
    </aside>
  </div>
</div>

<script>
const WS_URL = new URLSearchParams(location.search).get("ws")
  || (location.protocol.startsWith("http") ? `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws` : "ws://localhost:8765");
const JITTER_S = 0.3;  // how far behind the server clock we play, so packets arrive before they are due
const PENTA = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24].map(s => 220 * Math.pow(2, s / 12));
const $ = id => document.getElementById(id);
const COLOR = { red: "#f06a4f", blue: "#5b9cf5" };
const LABEL = { tr: { shot: "Şut", save: "Kurtarış", goal: "GOL", out: "Top dışarıda", foul: "Faul", kickoff: "Santra" },
  en: { shot: "Shot", save: "Save", goal: "GOAL", out: "Ball out", foul: "Foul", kickoff: "Kick-off" } };
// One dictionary for every UI string, in the interface language. The commentary language (what is spoken) is set apart.
const T = {

    mode_eyes_free: "Sadece ses", mode_casual: "Rahat", mode_analyst: "Analist", favLabel: "Favori oyuncu (kulaklık sesi)", favNone: "Yok",
    recapTitle: "Ne kaçırdım?", recapBtn: "Beni özetle", recapEmpty: "Henüz anlatım yok.", recapScore: "Skor",
    preparing: "Hazırlanıyor…", recapTag: "Özet", fullTime: "Maç sonu özeti", missedSince: "Dakika", recapSince: "sonrası",
    fullTimeLog: "Maç sonu", halfTimeLog: "Devre arası", ftShort: "MS",
    tourOffer: "Yeni misin? 60 saniyelik ses turu", tourSkip: "Turu geç", tourTag: "Ses turu",
    nowTitle: "Şu an", danger: "Tehlike", pressure: "Baskı", wing: "Kanat", earL: "sol kulak", earR: "sağ kulak",
    left: "sol", right: "sağ", mid: "orta", logEmpty: "Olaylar burada akacak.",
    layersTitle: "Katmanlar", lBall: "Top sesi (tehlike, kanat, takım)", lPress: "Baskı nabzı", lCrowd: "Tribün", lCue: "Olay sesleri", lVoice: "Anlatım",
    chapterLabel: "Nereden başlasın?", ch_kickoff: "Başlangıç\u00a0·\u00a00'", ch_first_goal: "İlk gol\u00a0·\u00a019'", ch_late: "Son dakikalar\u00a0·\u00a076'",
    spaceKey: "Boşluk", clubLabel: "Favori kulüp", clubNone: "Yok", yourTeam: "senin takımın",
    off: "Bağlı değil.", wait: "Sunucuya bağlanıldı, maç bekleniyor.", live: "Demo maçı · seed", lost: "Bağlantı koptu.",
    fail: "Sunucuya bağlanılamadı. run_local çalışıyor mu?", novoice: "Bu dilde cihaz sesi yok; anlatım altyazı olarak görünür.",
    voice: "Ses", voiceTail: "(cihaz sesi; sunucu Azure klibi gönderirse o çalar)", uiLangLabel: "Arayüz dili", commLabel: "Anlatım dili", install: "Uygulamayı yükle" },
  en: { sub: "The server sends the match as data; your device makes the sound. Best with headphones.", matchView: "Match view",
    pitchAria: "Ball position on the pitch", home: "Home", away: "Away", blindTitle: "Pitch hidden",
    blindSub: "You follow the match by sound alone.", tagIdle: "Narration",
    captionIdle: "Press \"Start listening\". The narrator only speaks when the ball is dead or danger is low.",
    idle: "Start listening", stop: "Stop", blindBtn: "Hide pitch", modeLabel: "Listening mode",
    mode_eyes_free: "Audio only", mode_casual: "Casual", mode_analyst: "Analyst", favLabel: "Favourite player (headphone cue)", favNone: "None",

const MODES = ["eyes_free", "casual", "analyst"];
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const LANGS = ["en", "tr"];
let uiLang = LANGS.includes(store.get("htg.lang")) ? store.get("htg.lang") : (navigator.language || "en").toLowerCase().startsWith("tr") ? "tr" : "en";

let mode = MODES.includes(store.get("htg.mode")) ? store.get("htg.mode") : "casual";
let club = ["HOME", "AWAY"].includes(store.get("htg.club")) ? store.get("htg.club") : "";  // favourite club: "", "HOME" or "AWAY"
let chapter = "first_goal";  // demo start point; the server only accepts its own chapters
const PLACEHOLDER_TEAMS = { HOME: "Northport", AWAY: "Valemont" };  // shown in the club picker until the server's hello names the teams

/* ---------------- audio ---------------- */
let ctx, master, duck, voiceBus, noiseBuf, waves, session = null, clip = null;
const layerOn = () => ({ ball: $("L_ball").checked, press: $("L_press").checked, crowd: $("L_crowd").checked,
  cue: $("L_cue").checked, voice: $("L_voice").checked });

function initAudio() {
  if (ctx) return;
  // iOS treats Web Audio as ambient sound and mutes it with the silent switch; "playback" makes it play like a music app (Safari 17+).
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4;
  master = ctx.createGain(); master.gain.value = 0.9;
  duck = ctx.createGain();

  duck.connect(master); voiceBus.connect(master); master.connect(comp); comp.connect(ctx.destination);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const mk = imag => ctx.createPeriodicWave(new Float32Array(imag.length), new Float32Array(imag));
  waves = { HOME: mk([0, 1, 0.35]), AWAY: mk([0, 1, 0, 0.4, 0, 0.22]) };
}

function out(dest, pan) {

  p.connect(dest); return p;
}
function envGain(dest, at, peak, attack, len) {

  g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), at + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, at + len);
  g.connect(dest); return g;
}
function sndTick(dest, at, team, danger, pan, vol) {
  const o = ctx.createOscillator();
  o.setPeriodicWave(waves[team]);
  o.frequency.value = PENTA[Math.min(PENTA.length - 1, Math.round(danger * (PENTA.length - 1)))];
  o.connect(envGain(out(dest, pan), at, vol, 0.005, 0.12));

}
function sndBeat(dest, at, vol) {

  o.frequency.setValueAtTime(75, at); o.frequency.linearRampToValueAtTime(50, at + 0.18);
  o.connect(envGain(dest, at, vol, 0.004, 0.2));

}

  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, at); f.Q.value = q;
  s.connect(f); f.connect(envGain(out(dest, pan), at, vol, attack, dur));

}

function sndWhoosh(d, at, pan) {
  const f = sndNoise(d, at, 0.4, "highpass", 600, 0.7, 0.55, pan, 0.25);
  f.frequency.exponentialRampToValueAtTime(3500, at + 0.35);
}

  o.connect(envGain(out(d, pan), at, 0.8, 0.002, 0.28)); o.start(at); o.stop(at + 0.3);
  sndNoise(d, at, 0.18, "lowpass", 400, 0.7, 0.35, pan, 0.002);
}
function sndWhistle(d, at, len, vol) {
  const o = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain();

  lfo.connect(lg); lg.connect(o.frequency);

  g.gain.linearRampToValueAtTime(vol, at + 0.02); g.gain.setValueAtTime(vol, at + len - 0.05);
  g.gain.linearRampToValueAtTime(0.0001, at + len); g.connect(d);

}
function sndEarcon(d, at, pan) {

    const o = ctx.createOscillator(); o.frequency.value = fr;
    o.connect(envGain(out(d, pan), at + off, 0.18, 0.003, len)); o.start(at + off); o.stop(at + off + len + 0.01);

// feel: "for" = your club scored (brighter, longer crowd swell), "against" = short muted crowd and no fanfare, "neutral" = no favourite
const GOAL_CROWD = { neutral: [1800, 0.32, 3.5], for: [3200, 0.45, 6.0], against: [600, 0.12, 1.2] };
function sndGoal(d, at, team, feel = "neutral") {
  const [cutoff, peak, len] = GOAL_CROWD[feel];
  const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cutoff;
  const g = ctx.createGain(); g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(peak, at + 0.6); g.gain.linearRampToValueAtTime(0.0001, at + len);
  s.connect(f); f.connect(g); g.connect(d); s.start(at); s.stop(at + len + 0.1);
  if (feel !== "against") [0, 4, 7, 12].forEach((st, k) => sndTick(d, at + k * 0.13, team, 0.5, 0, 0.3 * (1 + st / 24)));
  sndWhistle(d, at + 0.6, 0.7, 0.05);
}

function newSession() {
  const bus = ctx.createGain(); bus.connect(duck);
  const L = {}; ["ball", "press", "crowd", "cue"].forEach(k => { L[k] = ctx.createGain(); L[k].connect(bus); });
  const crowdSrc = ctx.createBufferSource(); crowdSrc.buffer = noiseBuf; crowdSrc.loop = true;
  const cf = ctx.createBiquadFilter(); cf.type = "lowpass"; cf.frequency.value = 900;
  const cg = ctx.createGain(); cg.gain.value = 0.03;
  crowdSrc.connect(cf); cf.connect(cg); cg.connect(L.crowd); crowdSrc.start();
  return { bus, L, crowdSrc, crowdGain: cg };
}

  s.bus.gain.setTargetAtTime(0, ctx.currentTime, 0.015);
  setTimeout(() => { try { s.crowdSrc.stop(); } catch (e) {} s.bus.disconnect(); }, 250);
}
function applyLayers() {
  if (!session) return;
  const on = layerOn();
  Object.keys(session.L).forEach(k => session.L[k].gain.setTargetAtTime(on[k] ? 1 : 0, ctx.currentTime, 0.03));
}

/* ---------------- live stream ---------------- */
// Match clock -> audio clock: audioTime = clock0 + matchT / speed. Everything the server sends carries a match time.
const live = { ws: null, clock0: null, speed: 1, teams: null, frames: [], due: [], score: [0, 0], lastTickSlot: -1, nextBeat: 0, cur: null, log: [], recap: [], favT: -99 };
const matchNow = () => (ctx.currentTime - live.clock0) * live.speed;
const audioAt = t => Math.max(ctx.currentTime, live.clock0 + t / live.speed);

function connect() {
  initAudio(); ctx.resume();
  primeVoice();
  resetLive();
  session = newSession(); applyLayers();
  $("playBtn").textContent = t("stop");
  $("status").textContent = t("wait");
  const ws = live.ws = new WebSocket(WS_URL + (WS_URL.includes("?") ? "&" : "?") + "chapter=" + chapter);
  ws.onmessage = e => onMessage(JSON.parse(e.data));
  ws.onclose = () => { if (live.ws === ws) { stopListening(t("lost")); } };
  ws.onerror = () => { if (live.ws === ws) { stopListening(t("fail")); } };
  live.timer = setInterval(schedule, 25);
}
function stopListening(msg) {
  const ws = live.ws; live.ws = null;
  if (ws) { ws.onclose = ws.onerror = null; ws.close(); }
  clearInterval(live.timer); endSession(session); session = null; stopSpeech();
  $("playBtn").textContent = t("idle"); $("status").textContent = msg || t("off");
}
function resetLive() {
  Object.assign(live, { clock0: null, frames: [], due: [], score: [0, 0], lastTickSlot: -1, nextBeat: 0, cur: null, log: [], recap: [], recapOut: null, ended: false });
  clearTimeout(recapWait); recapWait = null; setRecapBusy(false);
  $("score").textContent = "0 – 0"; renderLog(); live.recap = []; renderRecap(); live.favT = -99;
}

function onMessage(m) {
  if (m.type === "hello") {
    live.speed = m.speed || 1; live.teams = m.teams;
    for (const [side, id] of [["HOME", "Home"], ["AWAY", "Away"]]) {
      $("dot" + id).style.background = COLOR[m.teams[side].color] || "#ccc";
    }
    if (m.score) { live.score = [m.score.HOME || 0, m.score.AWAY || 0]; $("score").textContent = live.score.join(" – "); }
    live.seed = m.seed; $("status").textContent = `${t("live")} ${m.seed ?? m.match_id}`;
    fillFav(m.teams); setTeamNames(); fillClub(); sendMode(); sendClub();
  } else if (m.type === "state") {
    if (live.clock0 === null) live.clock0 = ctx.currentTime + JITTER_S - m.packets[0].t / live.speed;
    live.frames.push(...m.packets);
  } else if (m.type === "event_cue") {
    live.due.push({ t: m.t, kind: "cue", m });
  } else if (m.type === "speech") {
    live.due.push({ t: m.t, kind: "speech", m });
  } else if (m.type === "recap") {
    if (m.kind === "full_time") { live.due.push({ t: m.t, kind: "recap", m }); return; }  // plays when its match time arrives
    clearTimeout(recapWait); recapWait = null; setRecapBusy(false); playRecap(m);
  }
}

function schedule() {
  if (live.clock0 === null) return;
  const mt = matchNow(), horizon = mt + 0.12 * live.speed, L = session.L;
  // 10 Hz packets -> ~8 ticks per second, plus the pressure pulse
  while (live.frames.length && live.frames[0].t < horizon) {
    const r = live.frames.shift(), a = audioAt(r.t), late = a - live.clock0 - r.t / live.speed > 0.05;
    live.cur = r; live.trail = (live.trail || []).concat(r).slice(-15);
    const slot = Math.floor(r.t / 0.125);
    if (r.in_play && slot !== live.lastTickSlot && !late) sndTick(L.ball, a, r.team, r.danger, r.pan, 0.12 + 0.12 * r.tempo);
    live.lastTickSlot = slot;
    if (r.in_play && r.pressure > 0.15 && a >= live.nextBeat && !late) { sndBeat(L.press, a, 0.35 + 0.5 * r.pressure); live.nextBeat = a + 1 / (0.9 + 2.3 * r.pressure); }
    session.crowdGain.gain.setTargetAtTime(0.03 + 0.12 * r.danger, ctx.currentTime, 0.5);
  }
  live.due.sort((x, y) => x.t - y.t);
  while (live.due.length && live.due[0].t < horizon) {
    const d = live.due.shift(), m = d.m, a = audioAt(m.t);
    if (d.kind === "cue") cue(m, a);
    else if (d.kind === "recap") setTimeout(() => { if (live.ws) playRecap(m); }, Math.max(0, (a - ctx.currentTime) * 1000));

  }
}
function cue(m, a) {

  else if (k === "save") sndThud(L, a, m.pan);
  else if (["out", "foul"].includes(k)) sndWhistle(L, a + 0.1, 0.4, 0.04);
  else if (k === "kickoff") sndWhistle(L, a, 0.7, 0.05);
  else if (k === "period_end") {  // two short whistles at half-time; two short and a long one at full time
    sndWhistle(L, a, 0.3, 0.05); sndWhistle(L, a + 0.45, 0.3, 0.05);
    if (m.period === 2) {
      sndWhistle(L, a + 0.9, 1.1, 0.05);
      setTimeout(() => { live.ended = true; }, Math.max(0, (a - ctx.currentTime) * 1000));
    }
    addLog(Math.ceil(m.t), null, m.period === 2 ? t("fullTimeLog") : t("halfTimeLog"), a);
  }
  else if (k === "goal") { sndGoal(L, a, m.team, !club ? "neutral" : m.team === club ? "for" : "against"); live.score[m.team === "HOME" ? 0 : 1]++; $("score").textContent = live.score.join(" – "); }
  const fav = $("fav").value && m.player_id === $("fav").value;
  if (fav) {  // the favourite player touched the ball: a two-note chime on the side the ball is on, at most every 3 s of match time
    if (m.t - live.favT > 3) { sndEarcon(L, a + 0.02, m.pan); live.favT = m.t; flashFav(); }

}
function speech(m, a) {

  m.buf = { [lang()]: decodeClip(m, lang()) };  // decode ahead; the clip plays when its match time arrives

function decodeClip(m, l) {

}
function renderLog() {
  const ol = $("log"); ol.replaceChildren();
  if (!live.log.length) { const li = document.createElement("li"); li.innerHTML = '<span class="empty"></span>'; li.firstChild.textContent = t("logEmpty"); ol.append(li); return; }
  for (const e of live.log) {
    const li = document.createElement("li"), tm = document.createElement("time"), dot = document.createElement("span"), tx = document.createElement("span");
    tm.textContent = clock(e.t); dot.className = "dot"; dot.style.cssText = `background:${e.team ? COLOR[live.teams[e.team].color] : "var(--muted)"};width:8px;height:8px`;
    tx.textContent = e.label; li.append(tm, dot, tx); ol.append(li);
  }
}
function renderRecap() {
  const ol = $("recap"); ol.replaceChildren();

  if (r0) {  // the latest agent (or template) recap, above the narration list
    const li = document.createElement("li"), b = document.createElement("b"), p = document.createElement("span");
    li.className = "out";
    b.textContent = r0.kind === "full_time" ? t("fullTime") : `${t("recapTag")} · ${t("missedSince")} ${r0.since_min}${t("recapSince") ? " " + t("recapSince") : ""}`;
    p.textContent = r0.text[lang()].join(" "); p.lang = lang(); li.append(b, p);
    const sub = document.createElement("small"); sub.lang = uiLang; sub.hidden = lang() === uiLang; sub.textContent = r0.text[uiLang].join(" ");
    li.append(sub); ol.append(li);
  }
  if (!live.recap.length) { if (!r0) { const li = document.createElement("li"); li.className = "note"; li.textContent = t("recapEmpty"); ol.append(li); } return; }
  for (const r of live.recap) { const li = document.createElement("li"), tm = document.createElement("time"); tm.textContent = clock(r.t); li.append(tm, r.text[lang()]); ol.append(li); }
}
// "What did I miss?": the server's Recap agent writes 2-3 verified sentences (template recap if the agent fails). Without a server
// answer in RECAP_WAIT_MS, or before the match is connected, the old behaviour: score + the last three narrations.
const RECAP_WAIT_MS = 30000;
let recapWait = null;
function setRecapBusy(on) { const b = $("recapBtn"); b.textContent = on ? t("preparing") : t("recapBtn"); b.setAttribute("aria-busy", String(on)); }
function askRecap() {
  if (!(live.ws && live.ws.readyState === 1 && live.teams)) { readRecap(); return; }
  if (recapWait) return;
  live.ws.send(JSON.stringify({ type: "recap_request" }));
  setRecapBusy(true);
  recapWait = setTimeout(() => { recapWait = null; setRecapBusy(false); readRecap(); }, RECAP_WAIT_MS);
}
function playRecap(m) {
  live.recapOut = m; renderRecap();
  const joined = { en: m.text.en.join(" "), tr: m.text.tr.join(" ") };
  say({ text: joined, source: m.source, audio: m.audio, team: null }, m.kind === "full_time" ? t("fullTime") : t("recapTag"));
}
// The old "What did I miss": speak the score and the last three narrations, oldest first, with the device voice
function readRecap() {
  if (!live.recap.length) { setCaption({ [uiLang]: t("recapEmpty") }, false); return; }
  const said = l => [`${T[l].recapScore}: ${live.score.join(" - ")}.`, ...live.recap.slice(0, 3).reverse().map(r => r.text[l])];
  const lines = said(lang());
  setCaption({ [lang()]: lines.join(" "), [uiLang]: said(uiLang).join(" ") }, true); $("captionTag").textContent = t("recapTitle");
  const v = voiceFor[lang()];
  if ("speechSynthesis" in window && v) { speechSynthesis.cancel(); lines.forEach(l => { const u = new SpeechSynthesisUtterance(l); u.voice = v; u.lang = v.lang; u.rate = 1.05; speechSynthesis.speak(u); }); }
}
const clock = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;

/* ---------------- narration ---------------- */
let voiceFor = {}, fallbackTimer = null;
function pickVoices() {
  if (!("speechSynthesis" in window)) { $("voiceNote").textContent = t("novoice"); return; }
  const vs = speechSynthesis.getVoices();
  voiceFor.tr = vs.find(v => v.lang && v.lang.toLowerCase().startsWith("tr"));
  voiceFor.en = vs.find(v => /en[-_]gb/i.test(v.lang)) || vs.find(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  $("voiceNote").textContent = voiceFor[lang()] ? `${t("voice")}: ${voiceFor[lang()].name} ${t("voiceTail")}` : t("novoice");
}
function primeVoice() { if ("speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance("")); }  // unlock on the user gesture
// text: { en, tr }. Shows the commentary-language sentence; when the interface language differs and the message has it, that version
// sits under it in smaller muted text. A message with only one language shows that one (no translation in the client).
function setCaption(text, liveNow) {
  const main = text[lang()] !== undefined ? lang() : uiLang, sub = main !== uiLang ? text[uiLang] : undefined;
  $("captionMain").textContent = text[main] ?? ""; $("captionMain").lang = main;
  $("captionSub").textContent = sub ?? ""; $("captionSub").lang = uiLang; $("captionSub").hidden = !sub;
  $("captionTag").classList.toggle("idle", !liveNow);
}
function duckTo(v) { if (duck) duck.gain.setTargetAtTime(v, ctx.currentTime, 0.08); }
const TAG = { tr: { llm: "doğrulandı", agent: "doğrulandı", template: "şablon" }, en: { llm: "verified", agent: "verified", template: "template" } };
async function say(m, prefix) {
  const l = lang(), text = m.text[l];
  setCaption(m.text, true);
  $("captionTag").textContent = (prefix ? prefix + " · " : "") + TAG[uiLang][(m.source && m.source[l]) || "template"];
  $("captionMine").hidden = !(club && m.team === club);
  const finish = () => { duckTo(1); setTimeout(() => { $("captionTag").classList.add("idle"); $("captionMine").hidden = true; }, 400); };
  if (!$("L_voice").checked) return;
  duckTo(0.3);
  const buf = await ((m.buf && m.buf[l]) || decodeClip(m, l));
  if (buf && ctx) {  // Azure clip from the server
    stopClip();
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(voiceBus);
    src.onended = () => { if (clip === src) { clip = null; finish(); } };
    clip = src; src.start();
    return;
  }
  const v = voiceFor[l];
  if ("speechSynthesis" in window && v) {
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang; u.rate = 1.05; u.onend = finish; u.onerror = finish;
    speechSynthesis.cancel(); speechSynthesis.speak(u);

}
function stopClip() { const c = clip; clip = null; if (c) { c.onended = null; try { c.stop(); } catch (e) {} } }
function stopSpeech() { stopClip(); if ("speechSynthesis" in window) speechSynthesis.cancel(); clearTimeout(fallbackTimer); duckTo(1); }

/* ---------------- sound tour ---------------- */
// Before the first start: each step shows a caption, plays its pre-generated voice line (device voice if the clip is missing), then
// the real sound through the same functions the match uses. Text table: web/tour.json. Never starts the match; Skip stops at once.
const tour = { on: false, steps: null, bus: null, src: null, timers: [], clips: {}, wake: null };
const TOUR_DONE = "htg.tour";
const tourWait = s => new Promise(r => { tour.wake = r; tour.timers.push(setTimeout(r, s * 1000)); });
function tourBed(d, a, len, danger) {  // ticks + crowd, as under a live match
  for (let x = 0; x < len; x += 0.2) sndTick(d, a + x, "HOME", danger, 0, 0.14);
  const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.06, a); g.gain.linearRampToValueAtTime(0.0001, a + len);
  s.connect(f); f.connect(g); g.connect(d); s.start(a); s.stop(a + len + 0.05);
}
// Each demo schedules its sound from audio time `a` and returns its length in seconds.
const TOUR_DEMO = {
  ball: (d, a) => { for (let i = 0; i < 10; i++) sndTick(d, a + i * 0.2, "HOME", i / 9, 0, 0.2); return 2.1; },
  wing: (d, a) => { for (let i = 0; i < 10; i++) sndTick(d, a + i * 0.2, "HOME", 0.4, -1 + 2 * i / 9, 0.2); return 2.1; },
  teams: (d, a) => {
    for (let i = 0; i < 5; i++) { sndTick(d, a + i * 0.2, "HOME", 0.4, 0, 0.22); sndTick(d, a + 1.4 + i * 0.2, "AWAY", 0.4, 0, 0.22); }
    return 2.5;
  },
  pressure: (d, a) => { let x = a; for (let i = 0; i < 8; i++) { const p = i / 7; sndBeat(d, x, 0.35 + 0.5 * p); x += 1 / (0.9 + 2.3 * p); } return x - a + 0.2; },
  crowd: (d, a) => {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.03, a); g.gain.linearRampToValueAtTime(0.16, a + 2.2); g.gain.linearRampToValueAtTime(0.0001, a + 2.8);
    s.connect(f); f.connect(g); g.connect(d); s.start(a); s.stop(a + 2.9);
    for (let i = 0; i < 11; i++) sndTick(d, a + i * 0.2, "HOME", i / 10, 0, 0.14);
    return 2.9;
  },
  events: (d, a) => { sndClick(d, a, -0.3); sndWhoosh(d, a + 0.6, 0.3); sndThud(d, a + 1.3, 0.3); sndWhistle(d, a + 2.0, 0.4, 0.05); return 2.6; },
  goal: (d, a) => { sndGoal(d, a, "HOME", "for"); sndGoal(d, a + 3.6, "AWAY", "against"); return 5.0; },
  favourite: (d, a) => { sndEarcon(d, a, -0.5); sndEarcon(d, a + 0.8, 0.5); return 1.6; },
};
async function loadTour() {
  if (!location.protocol.startsWith("http")) return null;  // opened as a file (run_local): no tour
  try { const r = await fetch("tour/tour.json"); return r.ok ? (await r.json()).steps : null; } catch (e) { return null; }
}
async function tourClip(step, l) {
  const key = step.id + "_" + l;
  if (!(key in tour.clips)) {
    tour.clips[key] = fetch(`tour/${key}.mp3`).then(r => r.ok ? r.arrayBuffer() : null).then(b => b ? ctx.decodeAudioData(b) : null).catch(() => null);
  }
  return tour.clips[key];
}
function tourVoice(step) {
  const l = lang(), text = step[l];
  setCaption(step, true); $("captionTag").textContent = t("tourTag"); $("captionMine").hidden = true;
  return new Promise(async done => {
    tour.wake = done;
    const buf = await tourClip(step, l);
    if (!tour.on) return done();
    if (buf) {
      const src = tour.src = ctx.createBufferSource(); src.buffer = buf; src.connect(voiceBus); src.onended = done; src.start();
      return;
    }
    const v = voiceFor[l];
    if ("speechSynthesis" in window && v) {
      const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.onend = done; u.onerror = done;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } else tour.timers.push(setTimeout(done, text.length * 60));
  });
}
async function runTour() {
  initAudio(); ctx.resume(); primeVoice();
  tour.on = true; tour.bus = ctx.createGain(); tour.bus.connect(duck); syncLiveRegions();
  renderTourBtn();
  for (const l of ["en", "tr"]) tour.steps.forEach(s => tourClip(s, l));  // fetch and decode ahead, so steps follow without gaps
  for (const step of tour.steps) {
    if (!tour.on) return;
    if (step.demo === "duck") {  // the voice line itself shows the ducking: the match bed dips under it
      tourBed(tour.bus, ctx.currentTime + 0.05, 6, 0.35);
      await tourWait(1.0); if (!tour.on) return;
      duckTo(0.3); await tourVoice(step); duckTo(1);
      await tourWait(0.6);
      continue;
    }
    await tourVoice(step);
    if (!tour.on) return;
    const demo = TOUR_DEMO[step.demo];
    await tourWait(demo ? demo(tour.bus, ctx.currentTime + 0.1) + 0.4 : 0.2);
  }
  endTour();
}
function endTour() {
  if (!tour.on) return;
  tour.on = false; store.set(TOUR_DONE, "1"); syncLiveRegions();
  tour.timers.forEach(clearTimeout); tour.timers = [];
  const src = tour.src; tour.src = null; if (src) { src.onended = null; try { src.stop(); } catch (e) {} }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (tour.bus) { const b = tour.bus; tour.bus = null; b.gain.setTargetAtTime(0, ctx.currentTime, 0.01); setTimeout(() => b.disconnect(), 200); }
  duckTo(1);
  if (tour.wake) { const w = tour.wake; tour.wake = null; w(); }  // lets the running step return at once
  setCaption({ [uiLang]: t("captionIdle") }, false); $("captionTag").textContent = t("tagIdle");
  renderTourBtn();
}
function renderTourBtn() {
  const b = $("tourBtn");
  b.hidden = !tour.steps || (!tour.on && store.get(TOUR_DONE) === "1");
  b.textContent = tour.on ? t("tourSkip") : t("tourOffer");
  b.setAttribute("aria-pressed", String(tour.on));
}

/* ---------------- drawing ---------------- */
const pc = $("pitch");
function fit(c) {
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(r.width * dpr) || c.height !== Math.round(r.height * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
  return { w: c.width, h: c.height, dpr };
}
function teamColor(side) { return live.teams ? COLOR[live.teams[side].color] : "#ccc"; }
function drawPitch() {
  const { w, h, dpr } = fit(pc), g = pc.getContext("2d");
  const sx = x => x / 105 * w, sy = y => h - y / 68 * h;
  g.fillStyle = "#12301f"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 10; i++) if (i % 2) { g.fillStyle = "rgba(255,255,255,0.025)"; g.fillRect(sx(i * 10.5), 0, sx(10.5), h); }
  g.strokeStyle = "rgba(232,239,233,0.32)"; g.lineWidth = 1.5 * dpr;
  g.strokeRect(sx(0.4), sy(67.6), sx(104.2) - sx(0.4), sy(0.4) - sy(67.6));
  g.beginPath(); g.moveTo(sx(52.5), 0); g.lineTo(sx(52.5), h); g.stroke();
  g.beginPath(); g.arc(sx(52.5), sy(34), sx(9.15), 0, Math.PI * 2); g.stroke();
  [[0, 1], [105, -1]].forEach(([gx, d]) => {
    g.strokeRect(Math.min(sx(gx), sx(gx + d * 16.5)), sy(54.16), Math.abs(sx(16.5)), sy(13.84) - sy(54.16));
    g.strokeRect(Math.min(sx(gx), sx(gx + d * 5.5)), sy(43.16), Math.abs(sx(5.5)), sy(24.84) - sy(43.16));
  });
  const trail = live.trail || [];
  trail.slice(0, -1).forEach((p, i) => {
    if (!p.in_play) return;
    g.fillStyle = teamColor(p.team); g.globalAlpha = 0.5 * (i + 1) / trail.length;
    g.beginPath(); g.arc(sx(p.x), sy(p.y), 4 * dpr, 0, Math.PI * 2); g.fill();
  });
  g.globalAlpha = 1;
  const p = live.cur;
  if (!p) return;
  g.beginPath(); g.arc(sx(p.x), sy(p.y), 9 * dpr, 0, Math.PI * 2);
  g.fillStyle = p.in_play ? "#f5f7f5" : "rgba(245,247,245,0.4)"; g.fill();
  g.lineWidth = 3 * dpr; g.strokeStyle = teamColor(p.team); g.stroke();
}
function drawPanel() {
  const r = live.cur; if (!r) return;
  $("mDanger").style.width = (r.danger * 100) + "%"; $("vDanger").textContent = r.danger.toFixed(2);
  $("mPress").style.width = (r.pressure * 100) + "%"; $("vPress").textContent = r.pressure.toFixed(2);
  $("mPan").style.left = `calc(${(r.pan + 1) * 50}% - 7px)`;
  $("vPan").textContent = !r.in_play ? "—" : r.pan < -0.33 ? t("left") : r.pan > 0.33 ? t("right") : t("mid");
  $("clock").textContent = live.ended ? `90:00 · ${t("ftShort")}` : clock(r.t);  // the last ball frame is 89:59.9
}
function loop() { drawPitch(); drawPanel(); requestAnimationFrame(loop); }

/* ---------------- wiring ---------------- */
$("playBtn").addEventListener("click", () => { endTour(); live.ws ? stopListening() : connect(); });
$("tourBtn").addEventListener("click", () => tour.on ? endTour() : runTour());
loadTour().then(steps => { tour.steps = steps && steps.length ? steps : null; renderTourBtn(); });
$("blindBtn").addEventListener("click", e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", String(on)); $("blind").hidden = !on;
});
["L_ball", "L_press", "L_crowd", "L_cue"].forEach(id => $(id).addEventListener("change", applyLayers));
$("L_voice").addEventListener("change", () => { if (!$("L_voice").checked) stopSpeech(); syncLiveRegions(); });
// While the app speaks (Narration layer on, or the tour), the caption and recap must not also be announced by the screen reader:
// both voices talked at once. With the Narration layer off, the screen reader reads them instead.
function syncLiveRegions() {
  const v = $("L_voice").checked || tour.on ? "off" : "polite";
  $("caption").setAttribute("aria-live", v); $("recap").setAttribute("aria-live", v);
}
function setTeamNames() {
  if (!live.teams) return;
  for (const [side, id] of [["HOME", "Home"], ["AWAY", "Away"]]) $("name" + id).textContent = live.teams[side]["name_" + lang()];
}
function teamName(side) { return live.teams ? live.teams[side]["name_" + lang()] : PLACEHOLDER_TEAMS[side]; }
function fillClub() {
  const sel = $("club");
  sel.options[0].textContent = t("clubNone"); sel.options[1].textContent = teamName("HOME"); sel.options[2].textContent = teamName("AWAY");
  sel.value = club;
  $("yoursHome").hidden = club !== "HOME"; $("yoursAway").hidden = club !== "AWAY";
}
function sendClub() { if (live.ws && live.ws.readyState === 1) live.ws.send(JSON.stringify({ type: "set_favourite", team: club || null })); }
function applyChapter() { document.querySelectorAll("#chapters button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.chapter === chapter))); }
function fillFav(teams) {
  const sel = $("fav"), keep = sel.value; sel.replaceChildren(new Option(t("favNone"), ""));
  for (const side of ["HOME", "AWAY"]) {
    const g = document.createElement("optgroup"); g.label = teams[side]["name_" + lang()];
    teams[side].players.forEach(p => g.append(new Option(p.name, p.id))); sel.append(g);
  }
  sel.value = keep;
}
function flashFav() { const c = $("captionTag"); c.classList.remove("fav-flash"); void c.offsetWidth; c.classList.add("fav-flash"); }
function sendMode() { if (live.ws && live.ws.readyState === 1) live.ws.send(JSON.stringify({ type: "set_mode", mode })); }
function applyMode() {
  document.body.dataset.mode = mode;
  document.querySelectorAll("#modes button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  const eyes = mode === "eyes_free";  // eyes-free hides the pitch; the other modes leave the choice to the "close my eyes" button
  $("blindBtn").setAttribute("aria-pressed", String(eyes)); $("blind").hidden = !eyes;
}
function applyI18n() {
  document.documentElement.lang = uiLang;
  const busy = live.ws || tour.on;
  document.querySelectorAll("[data-i18n]").forEach(e => { if (!(e.id === "captionMain" && busy)) e.textContent = t(e.dataset.i18n); });
  if (!busy) { $("captionMain").lang = uiLang; $("captionSub").hidden = true; }
  document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.i18nAria)));
  $("uiLangSel").value = uiLang;
  document.querySelectorAll("#commLang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang())));
  $("playBtn").textContent = live.ws ? t("stop") : t("idle");
  if (!live.ws) $("status").textContent = t("off");
  setTeamNames(); fillClub();
  if (live.ws && live.seed !== undefined) $("status").textContent = `${t("live")} ${live.seed}`;
  if (live.teams) fillFav(live.teams); else $("fav").replaceChildren(new Option(t("favNone"), ""));
  renderLog(); renderRecap(); pickVoices(); renderTourBtn(); setRecapBusy(!!recapWait);
}
// Either language changes from the next sentence on; the one being spoken finishes and nothing restarts.
$("uiLangSel").addEventListener("change", e => { uiLang = e.target.value; store.set("htg.lang", uiLang); applyI18n(); });
document.querySelectorAll("#commLang button").forEach(b => b.addEventListener("click", () => {
  commLang = b.dataset.lang; store.set("htg.commentary", commLang); applyI18n();
}));
document.querySelectorAll("#modes button").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode; store.set("htg.mode", mode); applyMode(); sendMode();
}));
$("club").addEventListener("change", e => { club = e.target.value; store.set("htg.club", club); fillClub(); sendClub(); });
document.querySelectorAll("#chapters button").forEach(b => b.addEventListener("click", () => {
  chapter = b.dataset.chapter; applyChapter();
  if (live.ws) { stopListening(); connect(); }  // jump: a new session from the chosen chapter
}));
$("recapBtn").addEventListener("click", askRecap);
// Space starts and stops listening, except while typing or choosing in a field. Handled on keydown; the keyup is swallowed so a
// focused button does not also get clicked.
const typing = el => el && (el.isContentEditable || ["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName));
let spaceHandled = false;
document.addEventListener("keydown", e => {
  if (e.code !== "Space" || typing(e.target)) return;
  e.preventDefault(); spaceHandled = true;
  if (!e.repeat) $("playBtn").click();
});
document.addEventListener("keyup", e => { if (e.code === "Space" && spaceHandled) { e.preventDefault(); spaceHandled = false; } });
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = pickVoices;
// Install button (Chrome, Edge, Samsung Internet). The manifest is added only where the browser can offer the install prompt, so
// Safari keeps its own home-screen behaviour (apple-touch-icon, opens in Safari). The button sits last in the side column: no shift.
if ("onbeforeinstallprompt" in window) {
  const link = document.createElement("link"); link.rel = "manifest"; link.href = "manifest.webmanifest"; document.head.append(link);
  let installEvt = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("installBtn").hidden = false; });
  window.addEventListener("appinstalled", () => { installEvt = null; $("installBtn").hidden = true; });
  $("installBtn").addEventListener("click", async () => {
    if (!installEvt) return;
    const e = installEvt; installEvt = null; $("installBtn").hidden = true;
    e.prompt(); await e.userChoice.catch(() => null);
  });
}
applyMode(); applyChapter(); applyI18n(); syncLiveRegions();
requestAnimationFrame(loop);
</script>
</body>
</html>
