<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hear the Game</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Hear the Game">
<meta name="theme-color" content="#0d1512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: night-match broadcast desk. Pitch + Director timeline on the left, listening controls on the right; stacks on phones. Deliberately single dark theme. */
:root {
  color-scheme: dark;
  --night: #0d1512;
  --desk: #141f1b;
  --line: #24332d;
  --chalk: #e8efe9;
  --muted: #8fa39a;
  --turf: #12301f;
  --turf-line: rgba(232, 239, 233, 0.32);
  --red: #f06a4f;
  --blue: #5b9cf5;
  --amber: #f2b33d;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; overflow-anchor: none; }  /* TR and EN texts differ in length: no scrollbar jump, no scroll-anchoring jump */
#status { min-height: 1.5em; }
#voiceNote { min-height: 4.5em; }
#modes, #commLang { display: flex; width: 100%; }
#modes button, #commLang button { flex: 1 1 0; white-space: nowrap; }
body {
  background: var(--night); color: var(--chalk); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "title sub lang"; align-items: center; gap: 8px 24px; min-width: 0; }
.hdr-right { display: contents; }  /* its children sit in the header grid, so phones can put the TR/EN switch beside the title */
h1 { grid-area: title; font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5vw, 44px); letter-spacing: 0.01em; margin: 0; line-height: 1; text-transform: uppercase; }
h1 .accent { color: var(--amber); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; text-transform: none; }
/* Tagline: what the app is for, in the broadcast display face; the headphones hint sits under it, small and quiet. */
.sub { grid-area: sub; justify-self: end; display: grid; justify-items: end; gap: 3px; margin: 0; min-width: 0; }
.sub .tagline { font-family: var(--display); font-weight: 500; font-size: 21px; letter-spacing: 0.02em; color: var(--chalk); line-height: 1.15; }
.sub .hp { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
/* Layout, "broadcast desk". Player bar (match, score, transport) on top; then the desk: the pitch column (pitch, timeline, Why) left and
   the listening column (mode, caption, commentary feed or Analyst panels, recaps, settings) right, filling the pitch column's height.
   DOM order is the phone order. Phones (<= 860 px): one column, and the transport row is fixed to the bottom of the screen. */
.player { display: grid; gap: 8px; min-width: 0; }
.p-match { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; min-width: 0; }
.p-match .matchbar { flex: 1 1 420px; }
.p-match .scorebar { flex: 1 1 380px; }
.p-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; min-width: 0; }
.p-btns { display: flex; align-items: center; gap: 8px; }
.p-btns .hint { margin-right: 8px; }
#status { flex: 1 1 240px; min-width: 0; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }  /* one line: the bar never grows */
.desk { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px 18px; min-width: 0; }
/* minmax(0, 1fr): a column is never wider than the screen because of a long unbreakable line (the Settings summary once forced
   405 px on a 390 px phone, and Chrome zoomed the page out to fit) */
.d-now, .d-pitch, .d-listen { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; align-content: start; }
.modebar { display: flex; align-items: center; gap: 12px; min-width: 0; }
.modebar > span { font-size: 13px; color: var(--muted); white-space: nowrap; }
.why[hidden] { display: none; }
@media (min-width: 861px) {
  .player { position: sticky; top: 0; z-index: 10; background: var(--night); padding-block: 10px; margin-block: -10px; border-bottom: 1px solid var(--line); }
  .desk { grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "pitch now" "pitch listen"; }
  .d-now { grid-area: now; }
  .d-pitch { grid-area: pitch; }
  .d-listen { grid-area: listen; grid-template-rows: minmax(220px, 1fr); align-content: stretch; }
  .d-listen > :not(.feed) { align-self: start; }
  .d-listen .feed { height: auto; }  /* fills the column beside the pitch and scrolls inside */
  body[data-mode="analyst"] .d-listen { grid-template-rows: none; }  /* no feed in Analyst: the panels stack at their own height */
  /* pitch + timeline fit under the header and the player bar at 800-900 px; a narrower pitch is centred */
  .pitch-box { justify-self: center; width: min(100%, max(460px, calc((100vh - 420px) * 110 / 73))); }
  .d-now .caption { font-size: 17px; height: calc(5 * 1.45em + 22px); }  /* "now": the sentence being spoken, large */
}
@media (max-width: 860px) {
  body { padding-bottom: calc(var(--bar-h, 130px) + 20px); }  /* the fixed transport row never covers content (height measured in JS) */
  .p-ctl { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; flex-direction: column-reverse; align-items: stretch; gap: 6px;
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: rgba(13, 21, 18, 0.97); border-top: 1px solid var(--line); }
  .p-btns { display: grid; grid-template-columns: 2fr 1fr 1fr; }
  .p-btns .hint { display: none; }
  .p-btns button { min-height: 46px; padding: 6px 8px; line-height: 1.2; }
  #status { flex: none; font-size: 12px; }
}
/* Match bar: which match and how to watch it; one row on desktop, wraps on phones */
.matchbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.matchbar select { flex: 1 1 240px; min-width: 0; font-family: var(--display); font-size: 18px; letter-spacing: 0.03em; text-transform: uppercase; padding: 6px 10px; }
.matchbar .seg button { padding: 7px 14px; font-size: 14px; }
.matchbar[hidden] { display: none; }
.scorebar { display: flex; flex-wrap: nowrap; align-items: center; gap: 16px; min-width: 0; font-family: var(--display); font-size: 22px; text-transform: uppercase; letter-spacing: 0.03em; }
.team { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.team > span:not(.dot) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }  /* one line in every language: the pitch never moves */
.dot { flex: none; width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.score { flex: none; font-family: var(--mono); font-size: 20px; padding: 2px 10px; background: var(--desk); border: 1px solid var(--line); border-radius: 4px; }
.clock { flex: none; margin-left: auto; font-family: var(--mono); font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pitch-box { position: relative; border-radius: 6px; overflow: hidden; background: var(--turf); max-width: 100%; aspect-ratio: 110 / 73; }  /* the 105 x 68 m pitch plus 2.5 m of grass around it (PITCH_M) */
#pitch { width: 100%; height: 100%; display: block; }
.blind { position: absolute; inset: 0; background: #050807; display: grid; place-items: center; text-align: center; padding: 16px; }
.blind[hidden] { display: none; }
.blind p { font-family: var(--display); font-size: clamp(22px, 4vw, 34px); text-transform: uppercase; letter-spacing: 0.06em; margin: 0; }
.blind small { display: block; font-family: var(--body); font-size: 14px; color: var(--muted); text-transform: none; letter-spacing: 0; margin-top: 6px; }
.caption { min-width: 0; height: calc(4 * 1.5em + 22px); overflow-y: auto;  /* fixed height: TR and EN sentences differ in length, and the layout must not jump */ background: var(--desk); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; display: flex; gap: 12px; align-items: flex-start; }
.caption .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--night); background: var(--amber); padding: 2px 6px; border-radius: 3px; flex: none; margin-top: 2px; }
.caption .tag.idle { background: var(--line); color: var(--muted); }
.caption .tag.mine { background: var(--chalk); }
.caption .tags { display: grid; gap: 4px; flex: none; justify-items: start; }
.yours { flex: none; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--night); background: var(--chalk); padding: 1px 5px; border-radius: 3px; }
.yours[hidden] { display: none; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--muted); }
#captionText { margin: 0; min-width: 0; }
#captionSub { display: block; margin-top: 2px; font-size: 12px; line-height: 1.4; color: var(--muted); }  /* the same sentence in the interface language */
#captionSub[hidden], .out small[hidden] { display: none; }
.recap .out small { font-size: 12px; color: var(--muted); }
@media (max-width: 600px) {
  header { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "title lang" "sub sub"; }
  .sub { justify-self: start; justify-items: start; }
  .sub .tagline { font-size: 18px; }
  .scorebar { font-size: 18px; gap: 10px; }
  .score { font-size: 16px; padding: 2px 8px; }
  .clock { font-size: 15px; }
  .caption { height: calc(6 * 1.5em + 22px); }
}
@media (max-width: 380px) {
  header { gap: 8px 12px; }
  h1 { white-space: nowrap; }
  .scorebar { font-size: 16px; gap: 7px; letter-spacing: 0; }
  .team { gap: 5px; }
  .dot { width: 9px; height: 9px; }
  .score { font-size: 14px; padding: 2px 6px; }
  .clock { font-size: 13px; }
}
/* Evidence timeline: the session's 15 minutes. Top lane Insights (diamond, filled once spoken), bottom lane shots (small dot) and
   goals (large ringed dot). Markers are buttons; selecting one highlights its evidence on the pitch and fills the Why card. */
#timeline { display: grid; gap: 4px; }
.tl-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 14px; font-size: 12px; color: var(--muted); }

.tl-legend { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.tl-legend span { display: inline-flex; align-items: center; gap: 5px; }
.tl-legend i { display: inline-block; flex: none; background: var(--muted); }
.tl-legend .ins { width: 8px; height: 8px; transform: rotate(45deg); }
.tl-legend .shot { width: 7px; height: 7px; border-radius: 50%; }
.tl-legend .goal { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--chalk); }
.tl-legend .mo { width: 9px; height: 9px; border-radius: 50%; background: none; border: 2px solid var(--muted); }
.tl-track { background: var(--desk); border: 1px solid var(--line); border-radius: 6px; padding: 0 12px; height: 56px; cursor: pointer; }
.tl-inner { position: relative; height: 100%; }
.tl-inner::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--line); }
.tl-past { position: absolute; left: -12px; top: 0; bottom: 0; width: 0; background: rgba(242, 179, 61, 0.07); }
.tl-now { position: absolute; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; background: var(--amber); left: 0; }
.tl-band { position: absolute; top: 2px; bottom: 2px; background: rgba(242, 179, 61, 0.09); border-inline: 1px solid rgba(242, 179, 61, 0.35); border-radius: 2px; }
.tl-ht { position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px solid var(--muted); opacity: 0.45; }
.tl-axis span.ht { color: var(--chalk); }
#tlHint { font-size: 12px; color: var(--muted); margin: 0 12px; min-height: 1.5em; }
.tl-axis { position: relative; height: 16px; margin: 0 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.tl-axis span { position: absolute; transform: translateX(-50%); }
.tl .mk, .tl .mk[aria-pressed] { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; padding: 0; border: 0; border-radius: 50%;
  background: none; display: grid; place-items: center; --c: var(--muted); }
.tl .mk.ins { top: 28%; }
.tl .mk.shot, .tl .mk.goal { top: 72%; }
.tl .mk::before { content: ""; display: block; }
.tl .mk.ins::before { width: 9px; height: 9px; transform: rotate(45deg); border: 2px solid var(--c); }
.tl .mk.ins.spoken::before { background: var(--c); }
.tl .mk.shot::before { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tl .mk.goal { z-index: 2; }
.tl .mk.shot { z-index: 1; }
/* Known moments of the match, shown before they are played: hollow ring (goal larger), card as a small upright card. Select one to
   start 30 s before it. Played shots and goals sit on top of them. */
.tl .mk.mo { top: 72%; }
.tl .mk.mo::before { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--c); opacity: 0.8; }
.tl .mk.mo.goal::before { width: 15px; height: 15px; box-shadow: none; background: none; }
.tl .mk.mo.yellow::before, .tl .mk.mo.red::before { width: 7px; height: 10px; border-radius: 1px; border: 1px solid var(--night); opacity: 1; }
.tl .mk.mo.yellow::before { background: #f5d547; }
.tl .mk.mo.red::before { background: #e5484d; }
.tl .mk.goal::before { width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px var(--chalk); }
.tl .mk[aria-pressed="true"]::before { outline: 2px solid var(--amber); outline-offset: 2px; }
.tl .mk.new::before { animation: ping 0.9s ease-out 3; }
@keyframes ping { from { box-shadow: 0 0 0 0 var(--amber); } to { box-shadow: 0 0 0 9px rgba(242, 179, 61, 0); } }
@media (prefers-reduced-motion: reduce) { .tl .mk.new::before { animation: none; outline: 2px solid var(--amber); } }
.why { background: var(--desk); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; display: grid; gap: 6px; font-size: 13px; min-width: 0; }
.why-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.why-head b { font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; }
.why .tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--night); background: var(--amber); padding: 1px 6px; border-radius: 3px; }
.why .tag.dim { background: var(--line); color: var(--muted); }
.why .tag[hidden], .why dl[hidden], .why small[hidden] { display: none; }
.why p { margin: 0; }
.why small { display: block; color: var(--muted); font-size: 12px; }
.why dl { display: flex; flex-wrap: wrap; gap: 3px 14px; margin: 0; font-family: var(--mono); font-size: 12px; }
.why dl div { display: flex; gap: 6px; }
.why dt { color: var(--muted); }
.why dd { margin: 0; }
body[data-mode="eyes_free"] .tl-only { display: none; }
/* Live commentary feed (fan modes): the commentator's last lines, newest on top, as they are spoken. Fixed height: no layout jump. */
.feed { background: var(--desk); border: 1px solid var(--line); border-radius: 6px; padding: 8px 4px 8px 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; height: calc(6 * 1.45em + 46px); font-size: 13px; min-width: 0; }
.feed h2 { font-family: var(--display); font-weight: 500; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; }
/* The list scrolls inside the fixed box (the page never jumps); thin scrollbar in the desk colours. */
.feed ol { list-style: none; margin: 0; padding: 0 8px 0 0; display: grid; grid-template-columns: 30px auto minmax(0, 1fr); gap: 3px 8px;
  align-items: baseline; align-content: start; overflow-y: auto; min-height: 0;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent; overscroll-behavior: contain; }
.feed ol::-webkit-scrollbar { width: 6px; }
.feed ol::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.feed ol:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.feed li { display: contents; }  /* one grid for the whole list: the tag column is as wide as its widest tag, every row aligned */
.feed li.empty { display: block; grid-column: 1 / -1; }
.feed time { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.feed .tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--night); background: var(--amber); padding: 0 5px; border-radius: 3px; white-space: nowrap; text-align: center; }
.feed .tag.dim { background: var(--line); color: var(--muted); }
.feed small { display: block; color: var(--muted); font-size: 12px; }
.feed .empty { color: var(--muted); }
body[data-mode="analyst"] .feed { display: none; }
.stats-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.stats-head .seg button { padding: 4px 10px; font-size: 12px; }
table.stats { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
table.stats th { font-weight: 400; color: var(--muted); text-align: left; padding: 4px 0; }
table.stats thead th { font-family: var(--display); font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--chalk); }
table.stats thead th:first-child { width: 42%; }
table.stats td { padding: 4px 0 4px 8px; }
table.stats .v { display: block; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
table.stats .b { display: block; height: 4px; margin-top: 3px; background: #0f1916; border-radius: 2px; overflow: hidden; }
table.stats .b i { display: block; height: 100%; border-radius: 2px; }
#statsNote { font-size: 11px; }
.panel { background: var(--desk); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 12px; }
.panel h2 { font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button, select { font: inherit; color: var(--chalk); background: #1c2a25; border: 1px solid var(--line); border-radius: 5px; padding: 8px 12px; cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible, input:focus-visible, canvas:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#playBtn { background: var(--amber); color: var(--night); border-color: var(--amber); font-weight: 500; min-width: 150px; }
/* First-visit sound tour offer: gone for good once done or dismissed */
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; border: 1px dashed var(--amber); border-radius: 6px; padding: 8px 12px; color: var(--amber); font-size: 14px; }
.banner[hidden] { display: none; }
.banner > span { flex: 1 1 200px; color: var(--chalk); }
#tourBtn { border-color: var(--amber); color: var(--amber); background: transparent; }
#tourBtn[aria-pressed="true"] { background: transparent; color: var(--chalk); border-color: var(--chalk); }
.banner .icon { background: transparent; border: 0; font-size: 20px; line-height: 1; padding: 2px 8px; color: var(--muted); }
#blindBtn { position: absolute; top: 8px; right: 8px; z-index: 2; padding: 3px 10px; font-size: 12px; background: rgba(13, 21, 18, 0.8); }
#blindBtn[aria-pressed="true"] { background: var(--chalk); color: var(--night); border-color: var(--chalk); }  /* pressed: readable on the dark cover */
/* Settings: one closed box; the summary shows the current choices */
.settings { display: block; }
.settings summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 10px; min-width: 0; font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.settings summary::-webkit-details-marker { display: none; }
.settings summary::before { content: "▸"; color: var(--amber); }
.settings[open] summary::before { content: "▾"; }
.settings .sum { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--body); font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--chalk); }
.settings-body { display: grid; gap: 12px; margin-top: 12px; }
#installBtn { justify-self: stretch; }
#installBtn[hidden] { display: none; }
#recapBtn[aria-busy="true"] { opacity: 0.7; cursor: progress; }
#nextBtn:disabled { opacity: 0.45; cursor: default; }
.recap .out { display: grid; gap: 4px; padding: 8px 10px; border-left: 3px solid var(--amber); background: #101a16; border-radius: 0 4px 4px 0; }
.recap .out b { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); }
button[aria-pressed="true"] { background: var(--chalk); color: var(--night); border-color: var(--chalk); }
.chips button { padding: 5px 9px; font-size: 13px; }
.toggles { display: grid; gap: 7px; }
.toggles label { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.toggles input { accent-color: var(--amber); width: 16px; height: 16px; }
.meter { display: grid; grid-template-columns: 76px minmax(0, 1fr) 42px; align-items: center; gap: 10px; font-size: 13px; }
.meter .bar { height: 8px; background: #0f1916; border-radius: 4px; overflow: hidden; position: relative; }
.meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; }
.meter .val { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.pan .bar { overflow: visible; }
.pan .knob { position: absolute; top: -3px; width: 14px; height: 14px; border-radius: 50%; background: var(--chalk); left: calc(50% - 7px); }
.pan .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.panlabels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin: -6px 0 0 86px; padding-right: 52px; }
ol.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13px; }
ol.log li { display: grid; grid-template-columns: 46px 10px minmax(0, 1fr); gap: 8px; align-items: center; }
ol.log time { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
ol.log .fav { color: var(--amber); font-size: 11px; margin-left: 4px; }
ol.log .empty { color: var(--muted); display: block; grid-column: 1 / -1; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 6px 12px; background: transparent; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--night); }
/* Interface language: a globe + dropdown pill, so it does not look like the EN/TR commentary buttons in the panel */
#appLang { grid-area: lang; display: inline-flex; align-items: center; gap: 6px; padding: 0 4px 0 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); cursor: pointer; }
#appLang:hover { border-color: var(--muted); }
#appLang:focus-within { outline: 2px solid var(--amber); outline-offset: 2px; }
#appLang svg { flex: none; }
#appLang select { border: 0; background: transparent; padding: 6px 4px; font-size: 13px; }
#appLang select:focus-visible { outline: none; }
#appLang option { background: var(--desk); }
@media (max-width: 380px) {  /* keeps the pill clear of the title at 320 px */
  #appLang { gap: 3px; padding-left: 7px; }
  #appLang select { padding: 5px 0; font-size: 12px; }
}
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.field select { width: 100%; color: var(--chalk); }
.recap { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.recap time { font-family: var(--mono); color: var(--muted); margin-right: 8px; }
body[data-mode="eyes_free"] .analyst-only, body[data-mode="casual"] .analyst-only { display: none; }
body[data-mode="eyes_free"] .stage .scorebar .clock { display: none; }
.fav-flash { animation: flash 0.9s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--amber); } to { box-shadow: 0 0 0 3px transparent; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

        <span class="team"><span class="yours" id="yoursAway" data-i18n="yourTeam" hidden></span><span id="nameAway" data-i18n="away"></span><span class="dot" id="dotAway" style="background: var(--blue)"></span></span>
        <span class="clock" id="clock">0:00</span>

    <div class="p-ctl" id="controls">

      </div>

        <div class="panlabels"><span data-i18n="earL"></span><span data-i18n="earR"></span></div>

const live = { ws: null, clock0: null, speed: 1, teams: null, frames: [], due: [], score: [0, 0], lastTickSlot: -1, nextBeat: 0, cur: null, log: [], recap: [], favT: -99,

    live.moments = m.moments || null; live.watch = m.watch || "live"; renderTimeline();
    live.players = Object.fromEntries(["HOME", "AWAY"].flatMap(s => m.teams[s].players.map(p => [p.id, p.name])));
    for (const [side, id] of [["HOME", "Home"], ["AWAY", "Away"]]) {

    if (m.score) { live.score = [m.score.HOME || 0, m.score.AWAY || 0]; $("score").textContent = live.score.join(" – "); }

  teams: (d, a) => {

const pc = $("pitch");

}

// clean corners and the goals sit behind the goal line. Ball, trail and evidence use the same sx / sy.

  const arc = (x, y, r, a0, a1) => { g.beginPath(); g.arc(sx(x), sy(y), r * k, a0, a1); g.stroke(); };
  const spot = (x, y) => { g.beginPath(); g.arc(sx(x), sy(y), Math.max(1.5 * dpr, 0.22 * k), 0, Math.PI * 2); g.fill(); };

  const D = Math.acos(5.5 / 9.15);  // where the penalty arc leaves the box: 16.5 m line, spot at 11 m

    rect(Math.min(gx, gx + d * 5.5), 24.84, Math.max(gx, gx + d * 5.5), 43.16);

  }

    .forEach(([x, y, a0, a1]) => arc(x, y, 1, a0, a1));  // corner arcs, 1 m

  if (!p) return;
  const white = live.teams && live.teams[p.team].color === "white";  // a white ring on a white ball would hide the team: dark ball
  g.beginPath(); g.arc(sx(p.x), sy(p.y), 9 * dpr, 0, Math.PI * 2);
  g.fillStyle = white ? (p.in_play ? "#1d2b26" : "rgba(29,43,38,0.5)") : p.in_play ? "#f5f7f5" : "rgba(245,247,245,0.4)"; g.fill();

  $("settingsSum").textContent = [t("mode_" + mode), lang().toUpperCase(), c ? `★ ${c.name}` : t("sumNoClub")].join(" · ");
}
function applyI18n() {
  document.documentElement.lang = uiLang;
  if (live.ws && live.ws.readyState === 1) live.ws.send(JSON.stringify({ type: "set_lang", lang: lang() }));  // the commentator's voice
  const busy = live.ws || tour.on;
  document.querySelectorAll("[data-i18n]").forEach(e => { if (!(e.id === "captionMain" && busy)) e.textContent = t(e.dataset.i18n); });
  if (!busy) { $("captionMain").lang = uiLang; $("captionSub").hidden = true; }
  document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.i18nAria)));
  $("uiLangSel").value = uiLang;
  document.querySelectorAll("#commLang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang())));
  $("playBtn").textContent = live.ws ? t("stop") : t("idle");
  if (!live.ws) $("status").textContent = t("off");
  setTeamNames(); fillClub(); fillMatches();
  if (live.ws && live.teams) renderStatus();
  fillFav(live.teams || (curMatch() ? curMatch().teams : null));
  renderLog(); renderRecap(); pickVoices(); live.marks.forEach(renderMark); renderWhy(); renderStats(); renderTourBtn(); setRecapBusy(!!recapWait);
  renderTimeline(); renderFeed();
}
// Either language changes from the next sentence on; the one being spoken finishes and nothing restarts.
$("uiLangSel").addEventListener("change", e => { uiLang = e.target.value; store.set("htg.lang", uiLang); applyI18n(); });
document.querySelectorAll("#commLang button").forEach(b => b.addEventListener("click", () => {
  commLang = b.dataset.lang; store.set("htg.commentary", commLang); applyI18n(); preloadCallouts();
}));
// The delay is fixed per session (20 s in the fan modes, none in Analyst), so crossing between Analyst and a fan mode while listening
// restarts where the listener is, in the new mode (Highlights: the clip under way); otherwise a session started in Analyst would stay
// without the live commentator.
document.querySelectorAll("#modes button").forEach(b => b.addEventListener("click", () => {
  const was = mode;
  mode = b.dataset.mode; store.set("htg.mode", mode); applyMode(); sendMode();
  if (live.ws && (was === "analyst") !== (mode === "analyst")) { const at = playT(); stopListening(); connect(at ?? startT); }
}));
$("club").addEventListener("change", e => { favClub = e.target.value; store.set("htg.club", favClub); fillClub(); fillMatches(); sendClub(); });
// A new match or a new way to watch stops listening and waits for Start (from kick-off / the first clip): looking through the
// list, or an arrow key on the focused picker, must not start a match. The status line (read aloud) says what is ready. A timeline
// click, a moment and Next moment do start at once: they say "listen from here".
function readyFor() {
  if (live.ws) stopListening();
  $("status").textContent = `${t("ready")} ${uiTeam("HOME")} – ${uiTeam("AWAY")} · ${watch === "live" ? t("watchLive") : t("watchHl")}. ${t("pressStart")}`;
}
$("matchSel").addEventListener("change", e => {
  matchId = e.target.value; store.set("htg.match", matchId); startT = 0;
  if (live.ws) stopListening();
  resetLive(); applyMatch(); readyFor();  // nothing of the old match stays: caption, feed, log, markers, Why
  setCaption({ [uiLang]: t("captionIdle") }, false); $("captionTag").textContent = t("tagIdle"); $("captionMine").hidden = true;
});
document.querySelectorAll("#watch button").forEach(b => b.addEventListener("click", () => {
  if (watch === b.dataset.watch) return;
  watch = b.dataset.watch; store.set("htg.watch", watch); startT = 0; applyWatch(); readyFor();
}));
$("tlTrack").addEventListener("click", e => {
  if (e.target.closest(".mk")) return;
  const r = $("tlInner").getBoundingClientRect();
  startLive(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * matchLen());
});
$("nextBtn").addEventListener("click", nextMoment);
$("recapBtn").addEventListener("click", askRecap);
document.querySelectorAll("#statsWin button").forEach(b => b.addEventListener("click", () => { live.statsWin = b.dataset.win; renderStats(); }));
// Space starts and stops listening, except while typing or choosing in a field. Handled on keydown; the keyup is swallowed so a
// focused button does not also get clicked.
const typing = el => el && (el.isContentEditable || ["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName));
let spaceHandled = false;
document.addEventListener("keydown", e => {
  if (e.code !== "Space" || typing(e.target)) return;
  e.preventDefault(); spaceHandled = true;
  if (!e.repeat) $("playBtn").click();
});
document.addEventListener("keydown", e => {
  if (e.code !== "KeyN" || e.repeat || e.metaKey || e.ctrlKey || e.altKey || typing(e.target)) return;
  e.preventDefault(); nextMoment();
});
document.addEventListener("keyup", e => { if (e.code === "Space" && spaceHandled) { e.preventDefault(); spaceHandled = false; } });
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = pickVoices;
// Install button (Chrome, Edge, Samsung Internet). The manifest is added only where the browser can offer the install prompt, so
// Safari keeps its own home-screen behaviour (apple-touch-icon, opens in Safari). The button sits last in the side column: no shift.
if ("onbeforeinstallprompt" in window) {
  const link = document.createElement("link"); link.rel = "manifest"; link.href = "manifest.webmanifest"; document.head.append(link);
  let installEvt = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("installBtn").hidden = false; });
  window.addEventListener("appinstalled", () => { installEvt = null; $("installBtn").hidden = true; });
  $("installBtn").addEventListener("click", async () => {
    if (!installEvt) return;
    const e = installEvt; installEvt = null; $("installBtn").hidden = true;
    e.prompt(); await e.userChoice.catch(() => null);
  });
}
// A hidden tab stops listening (the client closes the socket, the server stops the session and its commentator) once nobody can hear
// it: 2 minutes after the browser suspended its audio (iOS lock screen, a frozen background tab). Listening with the screen locked is
// the point of the app, so a hidden tab whose sound still plays keeps going, up to 45 minutes, so a forgotten tab does not call
// Foundry for a whole match. Start picks up where it stopped. Checked every 10 s (hidden tabs may run timers less often).
const SILENT_STOP_MS = 2 * 60000, HIDDEN_STOP_MS = 45 * 60000;
let hiddenCheck = null;
function stopHidden() {
  const at = playT();
  stopListening(at === null ? undefined : `${t("pausedHidden")} ${clock(at)}.`);
  if (at !== null) startT = Math.floor(at);
}
document.addEventListener("visibilitychange", () => {
  clearInterval(hiddenCheck); hiddenCheck = null;
  if (!document.hidden || !live.ws) return;
  const hiddenAt = Date.now();
  let silentAt = null;
  hiddenCheck = setInterval(() => {
    if (!document.hidden || !live.ws) { clearInterval(hiddenCheck); hiddenCheck = null; return; }
    const now = Date.now();
    silentAt = ctx && ctx.state === "running" ? null : silentAt ?? now;
    if ((silentAt !== null && now - silentAt >= SILENT_STOP_MS) || now - hiddenAt >= HIDDEN_STOP_MS) {
      clearInterval(hiddenCheck); hiddenCheck = null; stopHidden();
    }
  }, 10000);
});
if (location.protocol.startsWith("http")) {
  fetch("matches.json").then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !j.matches || !j.matches.length) return;
    league = j; matchId = curMatch().id;
    applyMatch();
  }).catch(() => {});
}
// Phones: the transport row is fixed to the bottom; its real height (font size, safe area, two-line labels) sets the page's bottom
// padding, so the last panel (Settings) is never under it.
if ("ResizeObserver" in window) new ResizeObserver(() => document.body.style.setProperty("--bar-h", $("controls").offsetHeight + "px")).observe($("controls"), { box: "border-box" });  // padding too: the safe area is padding
applyMode(); applyWatch(); applyI18n(); syncLiveRegions(); renderFeed();
requestAnimationFrame(loop);
</script>
</body>
</html>
