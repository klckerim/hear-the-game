<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hear the Game</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Hear the Game">
<meta name="theme-color" content="#0d1512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="sr-only">Hear the Game</span><span aria-hidden="true">Hear the <span class="accent">Game</span></span></h1>  <!-- one text for screen readers; VoiceOver split the coloured word -->
    <div class="hdr-right">
      <p class="sub"><span class="tagline" data-i18n="sub"></span>
        <span class="hp"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg><span data-i18n="headphones"></span></span></p>
      <label id="appLang">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <select id="uiLangSel" data-i18n-aria="uiLangLabel"><option value="en" lang="en">English</option><option value="tr" lang="tr">Türkçe</option></select>
      </label>
    </div>
  </header>

  <div class="banner" id="tourBanner" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg>
    <span data-i18n="tourOffer"></span>
    <button id="tourBtn" type="button"></button>
    <button id="tourClose" type="button" class="icon" data-i18n-aria="tourDismiss"><span aria-hidden="true">×</span></button>
  </div>

  <!-- Player bar: which match, how to watch, the score, and the transport. Desktop: sticky under the header. Phone: the transport
       row (Start, Next moment, Catch me up, status) is fixed to the bottom of the screen; same buttons, not copies. -->
  <section class="player" id="player" data-i18n-aria="matchView">
    <div class="p-match">
      <div class="matchbar" id="matchbar" role="group" data-i18n-aria="matchBar" hidden>
        <!-- Match picker: a button showing the current match; it opens a list of match cards (club colours, "your team" first) -->
        <div class="mpick" id="mpick">
          <button type="button" id="matchBtn" aria-expanded="false" aria-controls="matchList"></button>
          <ul class="mlist" id="matchList" data-i18n-aria="matchLabel" hidden></ul>
        </div>
        <div class="seg" role="group" data-i18n-aria="watchLabel" id="watch">
          <button type="button" data-watch="live" aria-pressed="true" data-i18n="watchLive"></button>
          <button type="button" data-watch="highlights" aria-pressed="false" data-i18n="watchHl"></button>
        </div>
      </div>
      <div class="scorebar">
        <span class="team"><span class="dot" id="dotHome" style="background: var(--red)"></span><span id="nameHome" data-i18n="home"></span><span class="yours" id="yoursHome" data-i18n="yourTeam" hidden></span></span>
        <span class="score" id="score">0 – 0</span>
        <span class="team"><span class="yours" id="yoursAway" data-i18n="yourTeam" hidden></span><span id="nameAway" data-i18n="away"></span><span class="dot" id="dotAway" style="background: var(--blue)"></span></span>
        <span class="clock" id="clock">0:00</span>
      </div>
    </div>
    <div class="p-ctl" id="controls">
      <div class="p-btns">
        <button id="playBtn" type="button" aria-keyshortcuts="Space"></button><kbd class="hint" aria-hidden="true" data-i18n="spaceKey"></kbd>
        <button id="nextBtn" type="button" aria-keyshortcuts="N" data-i18n="nextBtn"></button><kbd class="hint" aria-hidden="true">N</kbd>
        <button id="recapBtn" type="button" data-i18n="recapBtn"></button>
      </div>
      <p class="note" id="status" role="status"></p>
    </div>
  </section>

  <!-- The desk. DOM order is the phone order (mode, caption, pitch, timeline, Why, listening column, settings); on desktop the
       pitch column sits left and the listening column right (grid-template-areas), with the listening column filling the height. -->
  <main class="desk">
    <div class="d-now">
      <div class="modebar"><span data-i18n="modeLabel" id="modeLabel"></span>
        <div class="seg" role="group" aria-labelledby="modeLabel" id="modes">
          <button type="button" data-mode="eyes_free" aria-pressed="false" data-i18n="mode_eyes_free"></button>
          <button type="button" data-mode="casual" aria-pressed="true" data-i18n="mode_casual"></button>
          <button type="button" data-mode="analyst" aria-pressed="false" data-i18n="mode_analyst"></button>
        </div>
      </div>
      <div class="caption" id="caption" aria-live="polite">
        <span class="tags"><span class="tag idle" id="captionTag" data-i18n="tagIdle"></span><span class="tag mine" id="captionMine" data-i18n="yourTeam" hidden></span></span>
        <p id="captionText"><span id="captionMain" data-i18n="captionIdle"></span><small id="captionSub" hidden></small></p>
      </div>
    </div>

    <div class="d-pitch">
      <div class="pitch-box">
        <canvas id="pitch" data-i18n-aria="pitchAria"></canvas>
        <div class="blind" id="blind" hidden><p><span data-i18n="blindTitle"></span><small data-i18n="blindSub"></small></p></div>
        <button id="blindBtn" type="button" data-i18n="blindBtn"></button>
      </div>
      <div class="tl" id="timeline" role="group" aria-labelledby="tlTitle">
        <div class="tl-head"><span id="tlTitle" data-i18n="tlTitle"></span>
          <span class="tl-legend" aria-hidden="true"><span><i class="ins"></i><span data-i18n="tlLegendIns"></span></span><span><i class="shot"></i><span data-i18n="tlShot"></span></span><span><i class="goal"></i><span data-i18n="tlGoal"></span></span><span><i class="mo"></i><span data-i18n="tlMoment"></span></span></span>
        </div>
        <div class="tl-track" id="tlTrack"><div class="tl-inner" id="tlInner"><div class="tl-past" id="tlPast"></div><div class="tl-ht"></div><div class="tl-now" id="tlNow" hidden></div></div></div>
        <div class="tl-axis" id="tlAxis" aria-hidden="true"></div>
        <p id="tlHint"></p>
      </div>
      <div class="why tl-only" id="why" aria-live="polite" hidden>
        <div class="why-head"><b id="whyTitle"></b><span class="tag" id="whyTag" hidden></span></div>
        <p><span id="whyMain"></span><small id="whySub" hidden></small></p>
        <dl id="whyFacts" hidden></dl>
        <small id="whyEvidence" hidden></small>
      </div>
    </div>

    <div class="d-listen">
      <div class="feed" id="feed" aria-live="off"><h2 data-i18n="feedTitle" id="feedTitle"></h2><ol id="feedList" tabindex="0" aria-labelledby="feedTitle"></ol></div>

      <div class="panel analyst-only" aria-live="off">
        <h2 data-i18n="nowTitle"></h2>
        <div class="meter"><span data-i18n="danger"></span><span class="bar"><span class="fill" id="mDanger" style="background: var(--amber)"></span></span><span class="val" id="vDanger">0.00</span></div>
        <div class="meter"><span data-i18n="pressure"></span><span class="bar"><span class="fill" id="mPress" style="background: var(--muted)"></span></span><span class="val" id="vPress">0.00</span></div>
        <div class="meter pan"><span data-i18n="wing"></span><span class="bar"><span class="mid"></span><span class="knob" id="mPan"></span></span><span class="val" id="vPan">orta</span></div>
        <div class="panlabels"><span data-i18n="earL"></span><span data-i18n="earR"></span></div>
        <ol class="log" id="log"></ol>
      </div>

      <div class="panel analyst-only">
        <div class="stats-head"><h2 data-i18n="statsTitle" id="statsTitle"></h2>
          <div class="seg" role="group" aria-labelledby="statsTitle" id="statsWin">
            <button type="button" data-win="match" aria-pressed="true" data-i18n="statsMatch"></button>
            <button type="button" data-win="last10" aria-pressed="false" data-i18n="statsLast10"></button>
          </div>
        </div>
        <table class="stats">
          <thead><tr><th scope="col"><span class="sr-only" data-i18n="statsStat"></span></th><th scope="col" id="stHome"></th><th scope="col" id="stAway"></th></tr></thead>
          <tbody id="statsBody"></tbody>
        </table>
        <p class="note" id="statsNote" data-i18n="statsNote"></p>
      </div>

      <div class="panel recap-panel">
        <h2 data-i18n="recapTitle"></h2>
        <ol class="recap" id="recap" aria-live="polite"></ol>
      </div>

      <details class="panel settings" id="settings">
        <summary><span data-i18n="settingsTitle"></span><span class="sum" id="settingsSum"></span></summary>
        <div class="settings-body">
        <div class="field"><span data-i18n="commLabel" id="commLabel"></span>
          <div class="seg" role="group" aria-labelledby="commLabel" id="commLang">
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
            <button type="button" data-lang="tr" aria-pressed="false">TR</button>
          </div>
        </div>
        <label class="field" for="club"><span data-i18n="clubLabel"></span>
          <select id="club"></select>
        </label>
        <label class="field" for="fav"><span data-i18n="favLabel"></span>
          <select id="fav"></select>
        </label>
        <div class="field"><span data-i18n="layersTitle" id="layersTitle"></span>
          <div class="toggles" role="group" aria-labelledby="layersTitle">
            <label for="L_ball"><input type="checkbox" id="L_ball" checked> <span data-i18n="lBall"></span></label>
            <label for="L_press"><input type="checkbox" id="L_press" checked> <span data-i18n="lPress"></span></label>
            <label for="L_crowd"><input type="checkbox" id="L_crowd" checked> <span data-i18n="lCrowd"></span></label>
            <label for="L_cue"><input type="checkbox" id="L_cue" checked> <span data-i18n="lCue"></span></label>
            <label for="L_callout"><input type="checkbox" id="L_callout" checked> <span data-i18n="lCallout"></span></label>
            <label for="L_voice"><input type="checkbox" id="L_voice" checked> <span data-i18n="lVoice"></span></label>
          </div>
        </div>
        <p class="note" id="voiceNote"></p>
        <button id="installBtn" type="button" data-i18n="install" hidden></button>
        </div>
      </details>
    </div>
  </main>
</div>

<script defer src="js/i18n.js"></script>
<script defer src="js/audio.js"></script>
<script defer src="js/session.js"></script>
<script defer src="js/stats.js"></script>
<script defer src="js/timeline.js"></script>
<script defer src="js/speech.js"></script>
<script defer src="js/tour.js"></script>
<script defer src="js/pitch.js"></script>
<script defer src="js/main.js"></script>
</body>
</html>
