[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hear-the-game"
version = "0.1.0"
description = "Synthetic football events turned into sound and explainable, verified narration."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "jsonschema>=4.20",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
azure = ["openai>=1.60", "azure-identity>=1.17", "azure-cognitiveservices-speech>=1.40"]

[tool.setuptools]
packages = ["htg", "htg.adapters", "htg.engine", "htg.narration", "htg.speech", "services", "services.engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["prototype", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
