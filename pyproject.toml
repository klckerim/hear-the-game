[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hear-the-game"
version = "0.1.0"
description = "Synthetic football events turned into sound and explainable, verified narration."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "jsonschema>=4.20",
  "websockets>=12",
  "opentelemetry-api>=1.27",  # no-op until telemetry.setup() configures an exporter
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# httpx and the util-genai pin: openai-v2 2.4b0 imports httpx (openai itself now ships httpx2) and breaks with util-genai 1.2b0
azure = ["openai>=1.60", "azure-identity>=1.17", "azure-ai-projects>=2.0", "azure-cognitiveservices-speech>=1.40",
         "azure-monitor-opentelemetry>=1.6", "opentelemetry-instrumentation-openai-v2>=2.0b0", "opentelemetry-util-genai==1.1b0", "httpx>=0.27"]

[tool.setuptools]
packages = ["htg", "htg.adapters", "htg.engine", "htg.narration", "htg.recap", "htg.speech", "services", "services.engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["prototype", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
